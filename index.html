<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cofound - Documentos Legales</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
  .container { max-width:640px; width:100%; }
  h1 { font-size:2.5rem; margin:0 0 .5rem; }
  .subtitle { color:var(--muted); margin-bottom:2.5rem; }
  .card { background:var(--card); border-radius:12px; padding:1.5rem; margin-bottom:1rem; text-decoration:none; color:var(--text); display:block; border:1px solid #334155; transition: border-color .2s, transform .2s; }
  .card:hover { border-color:var(--accent); transform: translateY(-2px); }
  .card h2 { margin:0 0 .25rem; font-size:1.25rem; }
  .card p { margin:0; color:var(--muted); font-size:.95rem; }
  footer { color:var(--muted); font-size:.85rem; margin-top:2rem; text-align:center; }
</style>
</head>
<body>
  <div class="container">
    <h1>Cofound</h1>
    <p class="subtitle">Conecta con profesionales y encuentra a tu próximo co-fundador.</p>

    <a class="card" href="privacy-policy.html">
      <h2>Política de Privacidad</h2>
      <p>Cómo recopilamos, usamos y protegemos tu información.</p>
    </a>

    <a class="card" href="terms.html">
      <h2>Términos y Condiciones</h2>
      <p>Reglas y condiciones de uso de la aplicación.</p>
    </a>

    <footer>© 2026 Cofound. Todos los derechos reservados.</footer>
  </div>
</body>
</html>
